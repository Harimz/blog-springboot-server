server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET}

app.cookies.secure=${COOKIE_SECURE:true}
app.cookies.sameSite=${COOKIE_SAMESITE:None}
app.cookies.refreshName=refresh_token

r2.endpoint=${R2_ENDPOINT}
r2.bucket=${R2_BUCKET}
r2.accessKeyId=${R2_ACCESS_KEY_ID}
r2.secretAccessKey=${R2_SECRET_ACCESS_KEY}
r2.publicBaseUrl=${R2_PUBLIC_BASE_URL}
r2.region=${R2_REGION:auto}